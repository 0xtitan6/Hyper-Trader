discovery:
  period: 30d             # 24h | 7d | 30d | all — 30d recommended so always_follow leaders inactive in the past 7d still surface with metrics
  top_n: 5                # max 9 — Hyperliquid WS user-sub cap is 10/IP and own-fill sub uses 1
  min_trades: 50
  min_volume_usd: 5000
  min_pnl_usd: 100
  refresh_seconds: 600
  score_lookback_hours: 720          # 30d — matches discovery.period; per-leader quality metrics use this same window

sizing:
  mode: proportional      # proportional | fixed
  proportional_fraction: 0.10
  fixed_usd: 25
  max_per_trade_usd: 100
  min_per_trade_usd: 10            # HL enforces $10 min on perp orders (and outcomes)
  outcome_min_per_trade_usd: 10    # Optional explicit override for HIP-4 outcomes
  ioc_slippage_bps: 50             # 0.5% slippage on IOC limit price; range [0, 1000]

risk:
  dry_run: true
  max_total_exposure_usd: 500
  max_daily_loss_usd: 100
  allowed_market_types: [outcome]   # outcome | perp | spot
  kill_switch_file: ./KILL
  # Free-margin headroom. max_total_exposure_usd is a NOTIONAL cap; these two
  # keys are what stop us submitting orders the account can't post margin for
  # (audit 2026-08-14: 1,599 "Insufficient margin" rejects in 30d vs 457
  # accepted orders). buffer_frac = share of free collateral we refuse to spend.
  margin_headroom_buffer_frac: 0.20    # [0.0, 1.0)
  margin_snapshot_max_age_s: 900       # older than this → check fails OPEN (HL still enforces)
  # Explicit cross leverage per traded asset, capped at the asset's maxLeverage.
  # Set on the first open of a coin we're flat in; never re-margins an open
  # position. Off = whatever default HL picks (was 5-10x, unchosen by us).
  set_leverage: true
  target_leverage: 3                   # [1.0, 50.0]
  # Manual positions opened outside the bot (e.g. discretionary outcome bets,
  # hand-traded HIP-3 names). LeaderReconciler skips these so they're never
  # flagged as orphans or auto-closed. Case-insensitive coin-name match.
  # manual_holdings:
  #   - "#1420"      # example: a manual outcome bet
  #   - "xyz:SPCX"   # example: a manual HIP-3 long

network:
  hyperliquid_env: testnet
  liquidiction_base: https://liquidiction.xyz

ops:
  state_db: ./state/state.db
  journal_path: ./state/journal.jsonl
  log_level: INFO
  log_json: false
  ws_stale_threshold_s: 120
  alert_min_level: warn   # info | warn | error | critical
