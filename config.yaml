    #   30d @ $411.21 proxy: 275 trades / 153 closes, 64% hit, net +$91.05,
    #   sharpe +0.87, maxDD $5.71 = 0.06x net. Looks like the best book we own.
    # STEP-2 clearinghouseState REJECTS the add:
    #   base equity $1,035.84 / gross $10,329.93 = 10.0x leverage (the max),
    #   ONE position — HYPE short 123.21 — unrealized -$330.25 = -31.9% of equity.
    #   xyz $0 / para $0.
    # That is the textbook closedPnl illusion: 100% of the +$91.05 realized net
    # is HYPE, and it is now sitting on an open HYPE loss 3.6x larger than its
    # entire 30d realized net, at max leverage, on a single name. Realized maxDD
    # of $5.71 is meaningless when the drawdown is being warehoused unrealized.
    # Sixth false positive of this exact shape (0xe2823659 et al).
    # NOT muted deliberately: $30 * 0.85 = $25.50 clip, clears $10 min after
    # floor-rounding. Reduced, not silenced — its realized turnover (153 closes,
    # 64% hit) is real, so this is a size cut on unrealized-risk evidence, not a
    # LOSER cut. If the HYPE short is closed at a loss it will show up in the
    # next window's net$ and can be cut properly then.
    # 2026-09-04: 0.85 -> 0.45 (-0.40). BOTH conditions the 09-01 note set as
    # cut-triggers have now fired, and a third arrived.
    # (1) THE UNREALIZED HOLE MORE THAN DOUBLED. Same single HYPE short, still
    #     10.05x (max leverage), still the only position:
    #       09-01  equity $1,035.84  unrealized -$330.25  = -31.9% of equity
    #       09-04  equity $1,068.19  unrealized -$740.54  = -69.3% of equity
    #     The short was NOT closed; the drawdown is still being warehoused where
    #     closedPnl cannot see it. -69.3% is far past the ~30%-of-equity Step-2
    #     reject line.
    # (2) THE EDGE IS ONE DAY. 30d fills (388, deduped by tid) split by day of
    #     closedPnl-minus-fees:
    #       08-22  +$11,294.53  (143 fills)   <-- 96% of the entire 30d total
    #       every other positive day combined: +$1,721.62 (mostly 08-13/08-07)
    #     and EIGHT consecutive negative sessions since that one day:
    #       08-23 -$38.86 / 08-24 -$57.95 / 08-25 -$719.71 / 08-26 -$3.90
    #       08-31 -$15.84 / 09-01 -$174.69 / 09-02 -$260.91 / 09-03 -$17.87
    #     Backtest net +$68.38 / sharpe +0.88 / 64% hit / maxDD $4.28 is an
    #     artifact of 08-22. Forward-looking the book has been negative for 12d.
    # (3) 100% single-name. Per-coin: HYPE +$10,464.63 of $11,716.71 total; the
    #     rest is HIP-4 outcome markets (#10650 etc.) that risk.allowed_market_types
    #     = [perp] filters out, so HYPE is our ONLY executable surface here.
    # Cut is -0.40, inside the +/-0.5 per-run bound. NOT a mute: $30 * 0.45 =
    # $13.50 -> HYPE szDecimals 2 -> 0.15 @ $87.07 = $13.06, clears
    # min_per_trade_usd $10. Verified mute-safe across HYPE $60-$250 (worst case
    # $12.00 at $200). Deliberately NOT 0.35 (the full -0.5 bound): $30 * 0.35 =
    # $10.50 -> $10.45 today, but HYPE above ~$107 floor-rounds it under $10 and
    # SILENTLY MUTES the leader. Never mute by rounding — if this needs to go to
    # zero, drop it explicitly.
    # NOTE: this leader is AUTO-DISCOVERED, not in always_follow. Deleting this
    # override does NOT remove it — src/leaders.py would fall back to auto-Sharpe
    # weighting, clip(0.88 + 1.0) = 1.88, i.e. a 2.1x BUMP. The explicit low
    # override IS the brake. Next run: if the HYPE short is finally closed at a
    # loss it lands in net$ and this becomes a clean LOSER cut toward 0.
    "0x9636dc553bb96c4870529af4c60f6701fab001dd": 0.45

    # 0xa3f996f2 PINNED 2026-09-06 at its current auto weight. It was dropped
    # from always_follow 2026-08-30 as an unfunded dead pin ($0 equity, 0 fills);
    # it has since REFUNDED and auto-discovery re-selected it (rank=25,
    # pnl=$3157, 111 trades, auto weight 1.11) — so it has been trading LIVE
    # while being INVISIBLE to Step-1, which only scores wallets that appear in
    # always_follow or leader_weights.
    # Backtest 30d @ $471 proxy: net +$64.79, sharpe +0.39, maxDD $33.78
    # (0.52x net), 60% hit over 169 closes / 414 trades = KEEPER on every leg.
    # Step-2 CLEAN: base equity $17,846.33, unrealized +$9,734.22 = +54.5% of
    # equity (a GAIN, not a bag), 3 positions, account leverage 10.0x.
    # This override is a BRAKE, not a bump: auto-Sharpe weighting is dynamic and
    # can drift this leader up with no Step-2 gate, and it runs 10x with a 40x
    # BTC leg and ~100% of its net from HYPE. Pinning 1.11 -> 1.10 caps that
    # drift and makes the leader permanently visible to future backtests.
    # Size change is ~1%: $30*1.10 = $33.00, well clear of min_per_trade_usd $10.
    "0xa3f996f2ec2b1fe240a57543bbfdb4d9d5804d04": 1.10
    # Dropped from always_follow 2026-07-20 (0 trades / dead slot).
    # "0xb7671719f8c8e2e51952cd1521f52ec2a5242dc8": 1.2

sizing:
  mode: fixed             # 2026-07-05: proportional→fixed per Neil "shoot $10 orders"
  proportional_fraction: 0.05
  fixed_usd: 30           # 2026-08-14: 10→30 for the $1,000 mission (see risk: block)
  max_per_trade_usd: 120          # 2026-08-14: 50→120, in step with fixed_usd 10→30
  min_per_trade_usd: 10           # HL enforces $10 min on perp orders too (e.g. asset=214 ZEC); was 1, kept rejecting fills
  outcome_min_per_trade_usd: 10   # HL HIP-4 enforces $10 USDH min order value
  ioc_slippage_bps: 50    # 0.5% slippage on IOC limit price; range [0, 1000]
  # PR #19: funding-aware sizing. When mirroring perps, factor in current
  # funding rate. Above amplify_threshold (favorable, we get paid funding) →
  # boost size linearly to amplify_cap. Below skip_threshold (we'd PAY a lot
  # of funding) → skip the trade. Outcomes ignored (settle once at expiry).
  use_funding_aware_sizing: true
  funding_amplify_threshold_apr_pct: 20.0   # below this favorable APR: no boost
  funding_amplify_cap: 1.5                  # max 1.5x size on extreme positive funding
  funding_skip_threshold_apr_pct: 100.0     # above this adverse APR: skip the trade

risk:
  dry_run: false
  # 2026-08-14: Neil set the $1,000-by-Aug-31 mission and reaffirmed twice
  # ("I don't care how"). Amplifying the ONLY edge we have evidence for (the
  # copy strategy) by raising gross exposure 350→800 (~4x book on $200.80).
  # Scales the 30d backtest run rate (+25.2%/mo, itself an UPPER BOUND) by
  # 2.29x, and scales portfolio maxDD to ~12% of account. This does NOT reach
  # $1,000 — projects ~$260 by Aug 31. Revert values in /tmp/config.yaml.bak-2240.
  max_total_exposure_usd: 800
  # 2026-08-15: per-BUILDER-DEX gross cap, separate from the base cap above.
  # Each HIP-3 dex settles against its own collateral, so one shared number was
  # charging xyz: orders for base-account risk: 40 of 40 blocked opens in a 4h
  # window were xyz (39 of them xyz:SP500 = 64% of our best leader's flow),
  # while base ran 2.4x maintenance coverage and xyz ran 14.6x. We were
  # throttling the safest, best-performing book we have.
  # Sizing: xyz held $308 gross on $61.48 equity with $4.20 maintenance
  # (~1.4% maint rate). At $500 gross, maintenance is ~$7 and coverage is still
  # ~8.8x, versus 2.4x on base. Headroom to grow the surface that works,
  # without letting it run unbounded.
  max_dex_exposure_usd: 500
  # Raised 30→80 in step with size: at 4x book the old $30 breaker would trip
  # on routine variance and halt trading. $80 = ~40% of account in one day.
  max_daily_loss_usd: 80
  allowed_market_types: [perp]   # outcome | perp | spot — perp-only this run (no USDH balance for outcomes)
  kill_switch_file: ./KILL
  # PR #30 auto-close: validated 2026-05-21 — WLD orphan correctly detected,
  # detection logic + closing path both work. Switching from alert-only to
  # autonomous close so we don't need operator hand-holding on each event.
  leader_exit_auto_close: true
  leader_exit_debounce_cycles: 2
  # Manual positions opened outside the bot. LeaderReconciler skips these so
  # operator-managed trades don't get flagged as orphans + auto-closed.
  # Match exactly (case-insensitive).
  manual_holdings:
    - "#1420"      # 2026 NBA Finals — Spurs side (manual outcome bet)
    - "#1430"      # NBA Finals Game 1 — Spurs side (manual outcome bet)
    - "xyz:SPCX"   # SpaceX long on xyz builder dex (manual HIP-3 trade)

network:
  hyperliquid_env: mainnet
  liquidiction_base: https://liquidiction.xyz

ops:
  state_db: ./state/state.db
  journal_path: ./state/journal.jsonl
  log_level: INFO
  log_json: false
  # 120s was triggering on routine HL connection cycles; 300s keeps real
  # disconnect signals while cutting the spam (raised 2026-05-10 after
  # /start enabled bot alerts to Telegram).
  ws_stale_threshold_s: 300
  alert_min_level: error  # info | warn | error | critical — bumped 2026-05-10
                          # to suppress routine WS-stale "warn" events.
