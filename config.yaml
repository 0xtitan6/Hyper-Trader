discovery:
  period: 30d             # 24h | 7d | 30d | all — 30d so always_follow leaders inactive in past 7d still show ranked metrics
  top_n: 4                # auto-discovered slots; 4 + 5 always_follow = 9 (HL hard cap)
  min_trades: 50
  min_volume_usd: 5000
  min_pnl_usd: 100
  refresh_seconds: 600
  # Quality filter (PR #13): screens leaders by holding-time + direction consistency
  # to catch scalpers and flip-floppers that raw PnL ranking misses.
  use_quality_filter: true
  score_lookback_hours: 720          # 30d — matches discovery.period to keep ranking + quality scoring on the same window
  # Tuned 2026-05-06 from live probe: 20s + sharpe 0.1 + dir 0.55 keeps fast-but-edged
  # perp leaders. Perp bias is critical (PR #15): HL leaderboard is dominated by
  # HIP-4 outcome traders, and bot trades perp-only — without perp bias, leaders
  # fire constantly but every fill gets filter-skipped on market type.
  # 2026-08-14 RAISED 10 -> 120. Safety fix for the fixed_usd 10->30 change made
  # the same evening. At $10 clips, high-frequency leaders were harmless: every
  # clip floor-rounded to $9.9x, failed the $10 minimum, and was silently dropped.
  # At $30 clips those same fills CLEAR the minimum and become real orders — and
  # auto-discovery had already selected 0x25773676, which does ~2.43M fills/30d
  # (~0.94/sec). That would fire tens of thousands of live $30 orders per day,
  # churning fees against a cap that reduce-only exits keep resetting.
  # 120s p50 blocks sub-second scalpers by ~100x while leaving our actual leaders
  # (0x819d06c0 ~8 fills/day, 0x9551e7d4 ~22 fills/day) far above the line.
  # Code's own default is 300s; 120 is the conservative middle.
  min_holding_time_s: 120
  min_sharpe: 0.1                    # require some realized edge, not just non-negative
  min_direction_consistency: 0.55    # 0.5 = pure flip-flop
  # 2026-05-10: relaxed back to 0.5 from 0.99. Single-leader mode produced
  # 30+ hours of idle (rank 31 quiet on weekends, no oil session). Active
  # quality leaders (rank 9 0x051c2e6d, rank 20 0x6cd520c1) score ~85-100%
  # perp on 24h activity but 7d window dilutes them. 0.5 captures the active
  # generalists while still rejecting outcome-specialists (HL leaderboard
  # is ~60% outcome flow per 2026-05-06 probe).
  score_perp_only: true
  min_perp_fraction: 0.5
  # 2026-08-15: solvency gate. A leaderboard rank is 30d HISTORY — a trader who
  # withdrew or blew up keeps the rank while trading nothing, and we burn one of
  # our ≤9 WS slots watching a corpse. 0x9551e7d4 held a live slot for a full day
  # at $0 equity / $0 notional / 0 positions / last fill 19.4h old; it passed
  # every check because 42% of its flow is xyz: perps, so min_perp_fraction was
  # satisfied while the wallet was empty. A sweep of the top-60 leaderboard found
  # 44 of them at ZERO perp equity, so this is the dominant failure mode.
  # WARNING: this gate applies to AUTO-DISCOVERY ONLY. Our best leader,
  # 0x819d06c0, holds just $30 of perp equity and WOULD be rejected by this —
  # it survives solely because it is pinned in always_follow, which bypasses
  # every filter. If anyone ever unpins it, this gate will silently drop the
  # best-evidenced leader we have (sharpe 0.59, 80% hit). Unpin only together
  # with lowering this number.
  min_leader_equity_usd: 500.0
  # Operator override: RWA-heavy leaders that fail the perp-bias filter
  # (because their xyz:* tokenized-stock activity is dwarfed by their HIP-4
  # outcome activity in raw fill counts) but who passed leader_score on their
  # RWA-only fills. Probed 2026-05-06 against top-50 leaderboard:
  #   - 0x8607a7d180… rank 31, $2,297, pure xyz:CL specialist
  #     (28h median hold, sharpe 1.13, dir 1.00)
  #   - 0x312a8bd562… rank 38, $1,997, paper-stocks basket
  #     (1.7h median hold, sharpe 0.17, dir 0.61)
  always_follow:
    # PR #36 backtest 2026-05-23: simulated 30d copy-trade with our sizing —
    # only 3 of 5 leaders had positive net edge. Dropped 0x051c2e6d
    # (4% hit rate, Sharpe -2.30, -$1550 simulated, CHIP wrecked them)
    # and 0xe0d28485 (24% hit rate, Sharpe -0.68, -$757 simulated).
    # Liquidiction's aggregate PnL was misleading for both — they earn
    # on outcomes/non-perp surfaces we don't mirror.
    #
    # rank 36 (was 31) — xyz:CL specialist, weekly oil session trader.
    # DROPPED 2026-07-23: LOSER re-confirmed 4th consecutive run. 30d net
    # +$55.83 but maxDD $429.45 (7.7x net), sharpe +0.04, 43% hit = pure
    # offsetting noise (LIT +$392 vs SKHX -$319). Muted at 0.1 floor since
    # 07-21 (~$1 clips skipped below min_per_trade_usd). Measurement complete —
    # freeing HL-cap slot for quality auto-discovery. Re-add only on positive evidence.
    # - "0x8607a7d180de23645db594d90621d837749408d5"
    # rank 20 — recurring quality: gave us PENDLE +$1.86 on 2026-05-06.
    # Backtest: +$60 net but Sharpe 0.04 (coin flip), kept at lower weight
    - "0x6cd520c1a07c9b53b33d62d04d3c2a3175161968"
    # 2026-08-14: PINNED. Best risk-adjusted leader we have ever measured —
    # 30d backtest at $200 proxy: 1879 trades, 80% hit, sharpe +0.59,
    # +$18.29 net, maxDD only $1.24. Was auto-discovered only, so any
    # discovery refresh could rotate it out. Pinning protects the edge.
    - "0x819d06c03a978a86d6884b11fbca4d228ea0d106"
    # rank 42 — SOL perp specialist. DROPPED 2026-07-20: 30d backtest = 0 trades
    # (dead slot). Freed for auto-discovery; re-add only on positive evidence.
    # - "0xb7671719f8c8e2e51952cd1521f52ec2a5242dc8"
  # Per-leader sizing weights — recalibrated from PR #36 backtest evidence.
  use_sharpe_weighting: true
  leader_weights:
    # Oil specialist — 2026-07-21 (3rd run): STILL no risk-adj edge. 30d net
    # +$52.80 but maxDD $429.45 (8.1x net) = LIT +$392 vs SKHX -$322 pure
    # offsetting noise, sharpe +0.04, 42% hit (coin flip). LOSER rule
    # (maxDD>4x net) re-confirmed 3x. Trajectory 2.0→1.5→1.0→0.5, now 0.5→0.1
    # (0.1 = config floor; at fixed $10 sizing this yields ~$1 clips that fall
    # below min_per_trade_usd $10 and get skipped = effective mute).
    # 2026-07-23: dropped from always_follow entirely — LOSER 4x confirmed
    # (net +$55.83 / maxDD $429.45 / sharpe +0.04). Weight removed.
    # "0x8607a7d180de23645db594d90621d837749408d5": 0.1
    # 2026-07-20: sole real earner in cohort — 30d net +$20.69, sharpe +0.10,
    # maxDD $22.56 (<2x net), 56% hit. Bumped 1.0 → 1.5 to concentrate on edge.
    # 2026-07-21: edge evaporated in one day — 30d net flipped +$20.69 → -$2.33,
    # sharpe +0.10 → -0.00, 56% → 50% hit (coin flip), maxDD $29.51. Now a LOSER
    # (net<0). Reverse yesterday's concentration bump: 1.5 → 1.0.
    "0x6cd520c1a07c9b53b33d62d04d3c2a3175161968": 1.0
    # 2026-08-14: concentrate on the sharpe leader (0.59 vs 0.26). Auto-weighting
    # had it at 1.36; 1.5 is a modest deliberate bump, not a new regime.
    "0x819d06c03a978a86d6884b11fbca4d228ea0d106": 1.5
    # Dropped from always_follow 2026-07-20 (0 trades / dead slot).
    # "0xb7671719f8c8e2e51952cd1521f52ec2a5242dc8": 1.2

sizing:
  mode: fixed             # 2026-07-05: proportional→fixed per Neil "shoot $10 orders"
  proportional_fraction: 0.05
  fixed_usd: 30           # 2026-08-14: 10→30 for the $1,000 mission (see risk: block)
  max_per_trade_usd: 120          # 2026-08-14: 50→120, in step with fixed_usd 10→30
  min_per_trade_usd: 10           # HL enforces $10 min on perp orders too (e.g. asset=214 ZEC); was 1, kept rejecting fills
  outcome_min_per_trade_usd: 10   # HL HIP-4 enforces $10 USDH min order value
  ioc_slippage_bps: 50    # 0.5% slippage on IOC limit price; range [0, 1000]
  # PR #19: funding-aware sizing. When mirroring perps, factor in current
  # funding rate. Above amplify_threshold (favorable, we get paid funding) →
  # boost size linearly to amplify_cap. Below skip_threshold (we'd PAY a lot
  # of funding) → skip the trade. Outcomes ignored (settle once at expiry).
  use_funding_aware_sizing: true
  funding_amplify_threshold_apr_pct: 20.0   # below this favorable APR: no boost
  funding_amplify_cap: 1.5                  # max 1.5x size on extreme positive funding
  funding_skip_threshold_apr_pct: 100.0     # above this adverse APR: skip the trade

risk:
  dry_run: false
  # 2026-08-14: Neil set the $1,000-by-Aug-31 mission and reaffirmed twice
  # ("I don't care how"). Amplifying the ONLY edge we have evidence for (the
  # copy strategy) by raising gross exposure 350→800 (~4x book on $200.80).
  # Scales the 30d backtest run rate (+25.2%/mo, itself an UPPER BOUND) by
  # 2.29x, and scales portfolio maxDD to ~12% of account. This does NOT reach
  # $1,000 — projects ~$260 by Aug 31. Revert values in /tmp/config.yaml.bak-2240.
  max_total_exposure_usd: 800
  # 2026-08-15: per-BUILDER-DEX gross cap, separate from the base cap above.
  # Each HIP-3 dex settles against its own collateral, so one shared number was
  # charging xyz: orders for base-account risk: 40 of 40 blocked opens in a 4h
  # window were xyz (39 of them xyz:SP500 = 64% of our best leader's flow),
  # while base ran 2.4x maintenance coverage and xyz ran 14.6x. We were
  # throttling the safest, best-performing book we have.
  # Sizing: xyz held $308 gross on $61.48 equity with $4.20 maintenance
  # (~1.4% maint rate). At $500 gross, maintenance is ~$7 and coverage is still
  # ~8.8x, versus 2.4x on base. Headroom to grow the surface that works,
  # without letting it run unbounded.
  max_dex_exposure_usd: 500
  # Raised 30→80 in step with size: at 4x book the old $30 breaker would trip
  # on routine variance and halt trading. $80 = ~40% of account in one day.
  max_daily_loss_usd: 80
  allowed_market_types: [perp]   # outcome | perp | spot — perp-only this run (no USDH balance for outcomes)
  kill_switch_file: ./KILL
  # PR #30 auto-close: validated 2026-05-21 — WLD orphan correctly detected,
  # detection logic + closing path both work. Switching from alert-only to
  # autonomous close so we don't need operator hand-holding on each event.
  leader_exit_auto_close: true
  leader_exit_debounce_cycles: 2
  # Manual positions opened outside the bot. LeaderReconciler skips these so
  # operator-managed trades don't get flagged as orphans + auto-closed.
  # Match exactly (case-insensitive).
  manual_holdings:
    - "#1420"      # 2026 NBA Finals — Spurs side (manual outcome bet)
    - "#1430"      # NBA Finals Game 1 — Spurs side (manual outcome bet)
    - "xyz:SPCX"   # SpaceX long on xyz builder dex (manual HIP-3 trade)

network:
  hyperliquid_env: mainnet
  liquidiction_base: https://liquidiction.xyz

ops:
  state_db: ./state/state.db
  journal_path: ./state/journal.jsonl
  log_level: INFO
  log_json: false
  # 120s was triggering on routine HL connection cycles; 300s keeps real
  # disconnect signals while cutting the spam (raised 2026-05-10 after
  # /start enabled bot alerts to Telegram).
  ws_stale_threshold_s: 300
  alert_min_level: error  # info | warn | error | critical — bumped 2026-05-10
                          # to suppress routine WS-stale "warn" events.
